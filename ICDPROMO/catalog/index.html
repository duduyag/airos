<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הקטלוג המלא | ICD Israel</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #111827;
      background: #f6f9fb;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
    }

    header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px min(32px, 5vw);
      background: #ffffff;
      border-bottom: 1px solid #dfe8ee;
    }

    img {
      width: min(190px, 46vw);
      height: auto;
      display: block;
    }

    a {
      color: #166d9a;
      font-weight: 700;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0;
    }

    h1 {
      margin: 0 0 14px;
      color: #11183a;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: #5b6472;
      font-size: 18px;
    }

    .viewer {
      height: min(78vh, 920px);
      min-height: 560px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dfe8ee;
      border-radius: 8px;
      box-shadow: 0 16px 44px rgba(17, 24, 58, 0.12);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (max-width: 560px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .viewer {
        height: 76vh;
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="../assets/icd-lab-logo.jpg" alt="ICD Israel International Creative Dental Lab">
    <a href="../index.html">חזרה לעמוד הראשי</a>
  </header>
  <main>
    <h1>הקטלוג המלא של ICD Israel</h1>
    <p>צפייה בקטלוג הדיגיטלי ישירות בדפדפן.</p>
    <div class="viewer">
      <iframe src="https://drive.google.com/file/d/13JnzPZZr7lFowKG3stpMzekR0qZPdVgR/preview" title="הקטלוג המלא של ICD Israel" allow="autoplay"></iframe>
    </div>
  </main>
</body>
</html>
